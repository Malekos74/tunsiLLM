[project]
name = "tunisian-llm"
version = "0.1.0"
description = "Dataset exploration pipeline for English-to-Tunisian Arabic LLM experiments"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "ollama>=0.4.0",
    "sacrebleu>=2.5.0"
]

[project.scripts]
tnllm = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]